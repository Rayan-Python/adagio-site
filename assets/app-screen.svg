<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- Mock Adagio running player screen (illustrative). Swap for a real screenshot anytime. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181A"/>
      <stop offset=".55" stop-color="#0C0D0E"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B4D455"/>
      <stop offset=".5" stop-color="#3E8E6E"/>
      <stop offset="1" stop-color="#16305A"/>
    </linearGradient>
    <radialGradient id="artGlow" cx=".3" cy=".25" r=".7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="artClip"><rect x="40" y="168" width="310" height="310" rx="26"/></clipPath>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <circle cx="320" cy="210" r="190" fill="#B4D455" opacity=".07"/>

  <!-- status bar (the Dynamic Island is drawn by the page on top) -->
  <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">9:41</text>
  <g fill="#FFFFFF" transform="translate(286 25)">
    <rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="7" rx="1"/><rect x="10" y="3.5" width="3" height="9.5" rx="1"/><rect x="15" y="1" width="3" height="12" rx="1"/>
    <path d="M30 5.2a9 9 0 0 1 12.6 0l-1.5 1.5a6.9 6.9 0 0 0-9.6 0zM32.5 7.8a5.4 5.4 0 0 1 7.6 0l-1.5 1.5a3.3 3.3 0 0 0-4.6 0zM36.3 12.6l-1.7-1.7a2.4 2.4 0 0 1 3.4 0z"/>
    <rect x="50" y="1.5" width="24" height="11.5" rx="3.5" fill="none" stroke="#FFFFFF" stroke-opacity=".5"/><rect x="52" y="3.5" width="17" height="7.5" rx="2"/><rect x="75.5" y="5" width="1.8" height="4.5" rx=".9" fill-opacity=".5"/>
  </g>

  <!-- header -->
  <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#8D9096">NOW RUNNING</text>
  <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Easy Run</text>
  <!-- live cadence badge -->
  <g transform="translate(234 108)">
    <rect width="116" height="34" rx="17" fill="#B4D455"/>
    <circle cx="18" cy="17" r="4.5" fill="#0C0D0E"/>
    <circle cx="18" cy="17" r="8" fill="none" stroke="#0C0D0E" stroke-opacity=".35" stroke-width="2"/>
    <text x="32" y="23" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#0C0D0E">174 BPM</text>
  </g>

  <!-- album art (abstract) -->
  <g clip-path="url(#artClip)">
    <rect x="40" y="168" width="310" height="310" fill="url(#art)"/>
    <circle cx="250" cy="250" r="120" fill="#0C0D0E" opacity=".18"/>
    <circle cx="250" cy="250" r="84" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="250" cy="250" r="48" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2"/>
    <path d="M40 420 C 120 360, 190 470, 270 400 S 350 380, 350 380 L350 478 L40 478 Z" fill="#0C0D0E" opacity=".35"/>
    <rect x="40" y="168" width="310" height="310" fill="url(#artGlow)"/>
  </g>
  <rect x="40" y="168" width="310" height="310" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- track -->
  <text x="40" y="530" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Night Run</text>
  <text x="40" y="558" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="17" fill="#8D9096">Lumen Drive</text>
  <!-- tempo match -->
  <g transform="translate(40 578)">
    <rect width="196" height="30" rx="15" fill="#B4D455" fill-opacity=".12" stroke="#B4D455" stroke-opacity=".6"/>
    <circle cx="16" cy="15" r="4" fill="#B4D455"/>
    <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#B4D455">Exact Match • 174 BPM</text>
  </g>

  <!-- waveform: played part in lime -->
  <g transform="translate(40 640)">
    <g fill="#B4D455">
      <rect x="0" y="18" width="4" height="14" rx="2"/><rect x="8" y="10" width="4" height="30" rx="2"/><rect x="16" y="4" width="4" height="42" rx="2"/><rect x="24" y="14" width="4" height="22" rx="2"/><rect x="32" y="8" width="4" height="34" rx="2"/><rect x="40" y="0" width="4" height="50" rx="2"/><rect x="48" y="12" width="4" height="26" rx="2"/><rect x="56" y="6" width="4" height="38" rx="2"/><rect x="64" y="16" width="4" height="18" rx="2"/><rect x="72" y="2" width="4" height="46" rx="2"/><rect x="80" y="10" width="4" height="30" rx="2"/><rect x="88" y="18" width="4" height="14" rx="2"/><rect x="96" y="6" width="4" height="38" rx="2"/><rect x="104" y="12" width="4" height="26" rx="2"/><rect x="112" y="4" width="4" height="42" rx="2"/><rect x="120" y="14" width="4" height="22" rx="2"/>
    </g>
    <g fill="#FFFFFF" fill-opacity=".22">
      <rect x="128" y="8" width="4" height="34" rx="2"/><rect x="136" y="16" width="4" height="18" rx="2"/><rect x="144" y="2" width="4" height="46" rx="2"/><rect x="152" y="10" width="4" height="30" rx="2"/><rect x="160" y="18" width="4" height="14" rx="2"/><rect x="168" y="6" width="4" height="38" rx="2"/><rect x="176" y="12" width="4" height="26" rx="2"/><rect x="184" y="0" width="4" height="50" rx="2"/><rect x="192" y="14" width="4" height="22" rx="2"/><rect x="200" y="8" width="4" height="34" rx="2"/><rect x="208" y="18" width="4" height="14" rx="2"/><rect x="216" y="4" width="4" height="42" rx="2"/><rect x="224" y="12" width="4" height="26" rx="2"/><rect x="232" y="6" width="4" height="38" rx="2"/><rect x="240" y="16" width="4" height="18" rx="2"/><rect x="248" y="2" width="4" height="46" rx="2"/><rect x="256" y="10" width="4" height="30" rx="2"/><rect x="264" y="18" width="4" height="14" rx="2"/><rect x="272" y="8" width="4" height="34" rx="2"/><rect x="280" y="14" width="4" height="22" rx="2"/><rect x="288" y="6" width="4" height="38" rx="2"/><rect x="296" y="16" width="4" height="18" rx="2"/><rect x="304" y="12" width="4" height="26" rx="2"/>
    </g>
  </g>
  <text x="40" y="716" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8D9096">1:42</text>
  <text x="350" y="716" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12" fill="#8D9096">3:28</text>

  <!-- controls -->
  <g fill="#FFFFFF" transform="translate(0 768)">
    <path d="M110 0 l-16 11 l16 11z M92 0 h4 v22 h-4z"/>
    <circle cx="195" cy="11" r="32" fill="#B4D455"/>
    <rect x="185" y="-1" width="7" height="24" rx="2" fill="#0C0D0E"/><rect x="198" y="-1" width="7" height="24" rx="2" fill="#0C0D0E"/>
    <path d="M280 0 l16 11 l-16 11z M294 0 h4 v22 h-4z"/>
  </g>

  <!-- home indicator -->
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".85"/>
</svg>
